<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WRECKED IDLE</title>
  <style>
    /* 색감(테마). 기본은 「가죽과 금」(짙은 갈색 가죽 판에 금테)이고, 설정 탭에서 다른 후보로 바꿔 볼 수 있다 (html의 data-theme). */
    :root {
      --page: #120d0a; --ink: #1a130f; --shell-a: #2b2019; --shell-b: #1c1510; --panel: #241a14; --bar: #221812;
      --card: #32261d; --card-a: #3f3024; --card-b: #2a1f18; --card-hi: #4c3a2a; --head-a: #4c3a2a; --head-b: #32261d;
      --line: #5c4630; --line-hi: #8a6a3f; --well: #17100c; --tab: #2e231b; --chip: #3f3125; --chip-text: #ecd9b6; --chip-done: #4a5a3a;
      --ghost: #4a392b; --ghost-d: #221912; --ghost-text: #f0dfc0;
      --sand: #e2aa4b; --sand-hi: #f6cf7c; --sand-d: #8f6424; --sand-ink: #3a2408;
      --coral: #e8563f; --coral-hi: #ff8468; --coral-ink: #3a0c05;
      --cyan: #6fc3ff; --cyan-hi: #a9dcff; --cyan-d: #2f78b8; --cyan-ink: #06243a;
      --gold: #ffd166; --red: #ff6b5e; --pink: #ffa6d5; --text: #fbf1dc; --dim: #b39f82; --sky-a: #7fb6d9; --sky-b: #d9ecd2;
      /* 틀: 금테(frame)와 그 안쪽의 어두운 줄(frame-in), 제목판(plaque), 체력바(hp) */
      --frame: #b88a3e; --frame-in: #1c130e; --plaque-a: #f3d9a0; --plaque-b: #d2a45c; --plaque-ink: #3b2412; --hp-a: #ff6a55; --hp-b: #c22f2a;
    }
    /* 해 질 녘: 짙은 남색 바다에 산호와 노랑 */
    :root[data-theme="dusk"] {
      --page: #070c18; --ink: #0b1222; --shell-a: #101a36; --shell-b: #0b1222; --panel: #111a30; --bar: #0d1530;
      --card: #18244a; --card-a: #1f2e5c; --card-b: #141d3c; --card-hi: #1f3160; --head-a: #223264; --head-b: #18244a;
      --line: #2c3d6e; --line-hi: #3a4c82; --well: #0b1222; --tab: #1a2648; --chip: #24325e; --chip-text: #c8d3f5; --chip-done: #1d4a5a;
      --ghost: #2a3a68; --ghost-d: #18223f; --ghost-text: #d7e0fb;
      --sand: #ffc857; --sand-hi: #ffdc82; --sand-d: #c08a22; --sand-ink: #3a2606;
      --coral: #ff7a6b; --coral-hi: #ff9a8d; --coral-ink: #3d0d08;
      --cyan: #5fe3d3; --cyan-hi: #98f5e9; --cyan-d: #2b9c92; --cyan-ink: #06312d;
      --gold: #ffd166; --red: #ff6b7a; --pink: #ffa6d5; --text: #f4f7ff; --dim: #8fa0c9; --sky-a: #5aa9c9; --sky-b: #a8dccf;
      --frame: #3a4c82; --frame-in: transparent; --plaque-a: #ffdc82; --plaque-b: #ffc857; --plaque-ink: #3a2606; --hp-a: #92f2a6; --hp-b: #36b56c;
    }
    /* 석호: 청록 바다와 주황 */
    :root[data-theme="lagoon"] {
      --page: #051416; --ink: #08191c; --shell-a: #0e3238; --shell-b: #08191c; --panel: #0b2226; --bar: #0a2428;
      --card: #12393f; --card-a: #17474f; --card-b: #0d2a30; --card-hi: #1a5058; --head-a: #1b545c; --head-b: #12393f;
      --line: #23585f; --line-hi: #327982; --well: #071a1d; --tab: #103036; --chip: #184850; --chip-text: #cdeee8; --chip-done: #1f6a55;
      --ghost: #1d4f57; --ghost-d: #0f2e33; --ghost-text: #d6f3ee;
      --sand: #ffd35c; --sand-hi: #ffe58f; --sand-d: #c2921f; --sand-ink: #3b2a05;
      --coral: #ff9f43; --coral-hi: #ffbd7a; --coral-ink: #3f1f02;
      --cyan: #7df9c1; --cyan-hi: #b6ffdd; --cyan-d: #35a878; --cyan-ink: #063323;
      --gold: #ffe066; --red: #ff7a7a; --pink: #ffb0d8; --text: #effffa; --dim: #86b3ad; --sky-a: #49c0c0; --sky-b: #c3f2d6;
      --frame: #327982; --frame-in: transparent; --plaque-a: var(--sand-hi); --plaque-b: var(--sand); --plaque-ink: var(--sand-ink); --hp-a: #92f2a6; --hp-b: #36b56c;
    }
    /* 난파선: 젖은 나무와 낡은 돛 */
    :root[data-theme="wreck"] {
      --page: #120c08; --ink: #1b120d; --shell-a: #33231a; --shell-b: #1b120d; --panel: #251912; --bar: #2a1c14;
      --card: #3c2a1f; --card-a: #4d3626; --card-b: #2e2018; --card-hi: #5a402d; --head-a: #5a402d; --head-b: #3c2a1f;
      --line: #6b4b33; --line-hi: #8a6445; --well: #1a110c; --tab: #33231a; --chip: #4a3324; --chip-text: #f0dcc0; --chip-done: #41553f;
      --ghost: #56402e; --ghost-d: #2c1e15; --ghost-text: #f3e3cb;
      --sand: #f3c969; --sand-hi: #ffe09a; --sand-d: #a87a25; --sand-ink: #3a2606;
      --coral: #e8563f; --coral-hi: #ff8468; --coral-ink: #3a0c05;
      --cyan: #8fd3b6; --cyan-hi: #c2f0db; --cyan-d: #4f8f76; --cyan-ink: #0c2e22;
      --gold: #ffd27a; --red: #ff6f61; --pink: #f3a8c4; --text: #fff4e2; --dim: #bfa387; --sky-a: #d9b98a; --sky-b: #f1e2bd;
      --frame: #b88a3e; --frame-in: transparent; --plaque-a: var(--sand-hi); --plaque-b: var(--sand); --plaque-ink: var(--sand-ink); --hp-a: #ff6a55; --hp-b: #c22f2a;
    }
    /* 별밤: 보랏빛 밤과 분홍 */
    :root[data-theme="night"] {
      --page: #0c0818; --ink: #140e26; --shell-a: #281c47; --shell-b: #140e26; --panel: #1b1333; --bar: #1d1437;
      --card: #2c2052; --card-a: #3a2a68; --card-b: #241a44; --card-hi: #45327a; --head-a: #45327a; --head-b: #2c2052;
      --line: #4d3b82; --line-hi: #6650a6; --well: #120c22; --tab: #251a45; --chip: #382a66; --chip-text: #e2d8ff; --chip-done: #2f4a78;
      --ghost: #3f2f72; --ghost-d: #20163c; --ghost-text: #e6dcff;
      --sand: #ffd86b; --sand-hi: #ffe9a3; --sand-d: #bf9226; --sand-ink: #3a2606;
      --coral: #ff7eb6; --coral-hi: #ffa6cf; --coral-ink: #40061f;
      --cyan: #7ee8fa; --cyan-hi: #b9f5ff; --cyan-d: #3a9fb3; --cyan-ink: #052b33;
      --gold: #ffd86b; --red: #ff7a8e; --pink: #ffb3e0; --text: #fbf4ff; --dim: #a99bc9; --sky-a: #8f7fd9; --sky-b: #f3c4e6;
      --frame: #6650a6; --frame-in: transparent; --plaque-a: var(--sand-hi); --plaque-b: var(--sand); --plaque-ink: var(--sand-ink); --hp-a: #92f2a6; --hp-b: #36b56c;
    }
    /* 먹색: 차분한 회색에 포인트 하나 */
    :root[data-theme="ink"] {
      --page: #0b0c0e; --ink: #121418; --shell-a: #23262d; --shell-b: #121418; --panel: #181a1f; --bar: #1a1c22;
      --card: #24272e; --card-a: #2d3139; --card-b: #1e2127; --card-hi: #363b45; --head-a: #363b45; --head-b: #24272e;
      --line: #3d434e; --line-hi: #565e6c; --well: #101216; --tab: #20232a; --chip: #2f343d; --chip-text: #e3e5e8; --chip-done: #33493f;
      --ghost: #353a44; --ghost-d: #1b1d22; --ghost-text: #e6e8ea;
      --sand: #f2cc8f; --sand-hi: #ffe2b3; --sand-d: #a8884f; --sand-ink: #33260f;
      --coral: #f25f5c; --coral-hi: #ff8a85; --coral-ink: #3a0907;
      --cyan: #81c7a4; --cyan-hi: #b4e6cc; --cyan-d: #4b8a6c; --cyan-ink: #0b2c1d;
      --gold: #f2cc8f; --red: #f25f5c; --pink: #e6a9c6; --text: #f1f1ee; --dim: #9aa0a8; --sky-a: #8b96a3; --sky-b: #d3d8dc;
      --frame: #565e6c; --frame-in: transparent; --plaque-a: var(--sand-hi); --plaque-b: var(--sand); --plaque-ink: var(--sand-ink); --hp-a: #92f2a6; --hp-b: #36b56c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--page); color: var(--text); font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; font-size: 12px; user-select: none; }
    /* 구석에 띄워 두는 작은 화면(500x420): 위에 얇은 전투 띠, 아래에 스쿼드. 창 크기에 맞춰 통째로 확대/축소한다 (main.ts) */
    #shell { position: absolute; left: 0; top: 0; width: 500px; height: 420px; background: linear-gradient(180deg, var(--shell-a), var(--shell-b)); overflow: hidden; transform-origin: 0 0; }
    /* 스쿼드를 접으면 전투 띠와 재화 띠만 남는다 */
    #shell.no-squad { height: 180px; }
    #shell.no-squad #squad { display: none; }
    /* 창이 화면 아래쪽에 있으면 스쿼드가 전투 화면 "위"에 펼쳐진다 (전투 화면과 재화 띠는 아래에 그대로 있다) */
    #shell.above:not(.no-squad) #squad { top: 0; }
    #shell.above:not(.no-squad) #battle, #shell.above:not(.no-squad) #drag { top: 240px; }
    #shell.above:not(.no-squad) #bar { top: 390px; }
    .hidden { display: none !important; }
    /* 버튼: 둥글고 아래에 두께가 있어 누르면 들어간다 */
    button { border: 0; border-radius: 9px; padding: 6px 12px; background: linear-gradient(180deg, var(--sand-hi), var(--sand)); color: var(--sand-ink); font: inherit; font-weight: 900; cursor: pointer; box-shadow: 0 3px 0 var(--sand-d); }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--sand-d); }
    button:disabled { background: var(--chip); color: var(--dim); cursor: default; box-shadow: 0 3px 0 var(--ghost-d); }
    button.ghost { background: var(--ghost); color: var(--ghost-text); box-shadow: 0 3px 0 var(--ghost-d); }
    button.on { background: linear-gradient(180deg, var(--cyan-hi), var(--cyan)); color: var(--cyan-ink); box-shadow: 0 3px 0 var(--cyan-d); }
    button.small { padding: 4px 11px; font-size: 12px; border-radius: 999px; }
    /* 제목판: 가운데에 놓인 양피지 조각 */
    h3 { display: table; margin: 0 auto 11px; padding: 3px 26px 4px; font-size: 15px; color: var(--plaque-ink); background: linear-gradient(180deg, var(--plaque-a), var(--plaque-b)); border: 2px solid var(--frame); border-radius: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 rgba(0,0,0,.4); }
    h4 { margin: 16px 0 7px; font-size: 12px; color: var(--cyan); letter-spacing: .06em; }
    p { margin: 0; }
    .hint { color: var(--dim); font-size: 11px; line-height: 1.65; }
    .row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin: 9px 0; }
    .dot { display: inline-block; width: 7px; height: 7px; margin-left: 5px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 2px rgba(255,122,107,.3); vertical-align: middle; }

    /* ---------- 전투 화면: 한 줄로 늘어서 싸우는 얇은 띠 ---------- */
    #battle { position: absolute; left: 0; top: 0; width: 500px; height: 150px; overflow: hidden; background: var(--ink); }
    /* 전투 캔버스: 화면 배율의 정수 배로 그려서(main.ts) 띠 크기에 맞춰 줄여 보여 준다 */
    #world { position: absolute; left: 0; top: 0; width: 500px; height: 150px; display: block; }
    #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* 스테이지 이름표: 스테이지가 바뀔 때만 미끄러져 나타났다가 잠시 뒤 스르르 사라진다 (main.ts가 show를 다시 붙인다) */
    /* 왼쪽 위: 이 스테이지의 몇 번째 맵인지 (늘 보인다, 배경 없음). 일반 스테이지는 칸 여러 개, 보스 스테이지는 마름모 하나 */
    #stage-bar { position: absolute; z-index: 3; top: 6px; left: 8px; display: flex; align-items: center; gap: 8px; pointer-events: none;
      text-shadow: -1px 0 0 #0b1222, 1px 0 0 #0b1222, 0 -1px 0 #0b1222, 0 1px 0 #0b1222, 0 2px 0 rgba(0,0,0,.5); }
    #stage-prog { display: flex; align-items: center; gap: 6px; }
    #stage-prog b { font-weight: 900; font-size: 13px; color: #fff3d6; }
    #stage-bar.boss #stage-prog b { color: var(--red); }
    .pips { display: flex; align-items: center; gap: 2px; }
    #stage-prog em { font-style: normal; font-weight: 800; font-size: 10px; color: #fff3d6; opacity: .85; }
    .pips i { width: 9px; height: 7px; border-radius: 2px; background: rgba(255,255,255,.2); box-shadow: 0 0 0 1px rgba(11,18,34,.9); }
    .pips i.done { background: var(--sand); }
    .pips i.edge { background: rgba(11,18,34,.6); box-shadow: 0 0 0 1px rgba(11,18,34,.9), inset 0 0 0 1.5px var(--gold); }
    .pips i.boss { width: 8px; height: 8px; margin: 0 2px; border-radius: 1px; transform: rotate(45deg); }
    .pips i.boss.done { background: var(--hp-a); }
    .pips i.boss.edge { box-shadow: 0 0 0 1px rgba(11,18,34,.85), inset 0 0 0 1.5px var(--red); }
    .pips i.now { background: #fff3d6; box-shadow: 0 0 0 1px rgba(11,18,34,.85), 0 0 5px 1px var(--gold); animation: pip-now 1.6s ease-in-out infinite; }
    .pips i.boss.now { background: #ffd9d2; box-shadow: 0 0 0 1px rgba(11,18,34,.85), 0 0 6px 1px var(--red); }
    @keyframes pip-now { 50% { filter: brightness(.72); } }
    /* 지역(보스) 이름: 스테이지가 바뀔 때만 옆에 나타났다가 사라진다 */
    #stage-name { font-weight: 900; font-size: 11px; white-space: nowrap; color: #fff3d6; opacity: 0; }
    #stage-name.show { animation: stage-in 4s ease forwards; }
    @keyframes stage-in { 0% { opacity: 0; transform: translateX(-10px); } 9% { opacity: 1; transform: none; } 72% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateX(4px); } }
    #stage-name small { margin-right: 5px; padding: 0 5px 1px; border-radius: 6px; background: var(--hp-b); color: #fff; font-weight: 900; font-size: 9px; text-shadow: none; }
    #stage-bar.boss #stage-name { color: #ffd9d2; }
    /* 보스 제한 시간: 전투 띠 오른쪽 아래의 배경 없는 글씨. 마지막 10초는 붉게 두근거린다 */
    #stage-timer { position: absolute; z-index: 3; right: 8px; bottom: 5px; font-weight: 900; font-size: 13px; color: #e6edff; pointer-events: none; transform-origin: 100% 100%;
      text-shadow: -1px 0 0 #0b1222, 1px 0 0 #0b1222, 0 -1px 0 #0b1222, 0 1px 0 #0b1222, 0 2px 0 rgba(0,0,0,.5); }
    #stage-timer small { margin-left: 1px; font-size: 10px; font-weight: 800; opacity: .8; }
    #stage-timer.low { color: var(--red); animation: timer-low 1s ease-out infinite; }
    @keyframes timer-low { 0% { transform: scale(1.22); filter: brightness(1.5); } 35% { transform: scale(1); filter: none; } 100% { transform: scale(1); } }
    #feed { position: absolute; z-index: 3; left: 6px; top: 26px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; pointer-events: none; }
    #feed div { padding: 1px 9px 2px; border-radius: 999px; background: rgba(11,18,34,.82); font-weight: 800; font-size: 10px; animation: feed 4s linear forwards; }
    #feed div::before { content: ''; display: inline-block; width: 5px; height: 5px; margin-right: 6px; border-radius: 50%; background: currentColor; vertical-align: 1px; }
    @keyframes feed { 0% { opacity: 0; transform: translateX(-12px); } 5% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; } }

    /* ---------- 재화와 버튼 ---------- */
    #bar { position: absolute; left: 0; top: 150px; width: 500px; height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 7px; background: var(--bar); border-top: 1px solid var(--ghost); border-bottom: 1px solid var(--ghost-d); }
    #bar .coin, #bar .clam { padding: 1px 10px 2px; border-radius: 999px; font-weight: 900; font-size: 13px; }
    /* 재화 그림 (도트) */
    .ico { width: 14px; height: 14px; margin-right: 5px; image-rendering: pixelated; vertical-align: -2px; }
    .ico.wide { width: 18px; }
    #bar .coin { color: var(--gold); background: rgba(255,209,102,.13); }
    #bar .clam { color: var(--pink); background: rgba(255,166,213,.13); }
    /* 자리가 모자라면 「초당」 글씨부터 줄어든다. 버튼은 줄바꿈하지 않는다 */
    #bar .rate { flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; color: var(--dim); font-size: 10px; }
    #bar .rate.bad { color: var(--red); }
    #bar .gap { flex: 1; }
    #bar button { flex: none; padding: 3px 10px; font-size: 11px; white-space: nowrap; border-radius: 999px; box-shadow: 0 2px 0 var(--sand-d); }
    #bar .coin, #bar .clam { flex: none; white-space: nowrap; }
    #bar button.ghost { box-shadow: 0 2px 0 var(--ghost-d); }
    #bar button.on { box-shadow: 0 2px 0 var(--cyan-d); }

    /* ---------- 스쿼드 (2x2, 한눈에 다 보이게) ---------- */
    #squad { position: absolute; left: 0; top: 180px; width: 500px; height: 240px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; padding: 6px; }
    .hero-card { position: relative; min-width: 0; padding: 5px 8px 5px 12px; background: linear-gradient(165deg, var(--card-a), var(--card-b)); border: 2px solid var(--frame); border-radius: 11px; box-shadow: inset 0 0 0 1px var(--frame-in), inset 0 2px 0 rgba(255,255,255,.05), 0 2px 0 rgba(0,0,0,.35); overflow: hidden; }
    /* 왼쪽 끝의 색 띠가 캐릭터를 알려 준다 */
    .hero-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--hero, var(--line)); }
    .hero-card.dead { filter: grayscale(.85) brightness(.7); }
    .hero-card.locked { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3px; color: var(--dim); border-style: dashed; background: rgba(255,255,255,.03); box-shadow: none; }
    .hero-card.locked::before { display: none; }
    .hero-card.locked .lock-q { font: 900 26px Impact, sans-serif; color: var(--line-hi); line-height: 1; }
    .hero-card.locked b { color: var(--chip-text); font-size: 13px; }
    .hero-card.locked p { font-size: 10px; line-height: 1.4; }
    .hero-card.locked em { font-style: normal; color: var(--gold); font-size: 10px; font-weight: 800; }
    .hc-top { display: flex; gap: 8px; align-items: flex-start; }
    /* 얼굴 초상화: 하늘빛 바탕에 캐릭터 색 테두리 */
    .hc-top .portrait { flex: none; width: 50px; height: 42px; object-fit: cover; background: linear-gradient(180deg, var(--sky-a), var(--sky-b)); border: 2px solid var(--hero, var(--line-hi)); border-radius: 11px; }
    .hc-name { flex: 1; min-width: 0; line-height: 1.25; }
    .hc-name b { font-size: 13px; color: var(--hero); }
    .hc-name span { margin-left: 4px; color: var(--dim); font-size: 10px; }
